name: Godot Web export

on:
  pull_request:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "worlds/**"
      - "resources/**"
      - "scripts/export-web.sh"
      - "scripts/godot-version.env"
      - "scripts/vercel-build.js"

permissions:
  contents: read

jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip curl

      - name: Web export
        run: bash scripts/export-web.sh

      - name: Verify artifact
        run: test -f dist/web/index.html
